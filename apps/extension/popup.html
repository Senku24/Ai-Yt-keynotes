<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KeyNotes</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main id="app">
    <header>
      <div class="brand">
        <svg class="logo" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
          <path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/>
        </svg>
        <h1>KeyNotes</h1>
      </div>
      <p class="tagline">YouTube takeaways, instantly</p>
    </header>

    <form id="url-form">
      <div class="input-row">
        <input
          id="url-input"
          type="url"
          placeholder="https://youtu.be/…"
          autocomplete="off"
          required
        />
        <button type="submit" id="submit-btn">
          <span class="btn-text">Go</span>
          <span class="btn-spinner" hidden>
            <svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
          </span>
        </button>
      </div>
    </form>

    <div id="toast" class="toast" hidden role="alert"></div>

    <div id="skeleton" class="skeleton" hidden>
      <div class="skel-line" style="width:80%"></div>
      <div class="skel-line" style="width:65%"></div>
      <div class="skel-line" style="width:90%"></div>
      <div class="skel-line" style="width:55%"></div>
      <div class="skel-line" style="width:72%"></div>
    </div>

    <section id="results" hidden>
      <div class="results-header">
        <h2>Keynotes</h2>
        <button id="copy-btn" class="icon-btn" title="Copy all">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
          </svg>
        </button>
      </div>
      <ul id="notes-list"></ul>
      <a id="source-link" class="source-link" target="_blank" rel="noopener noreferrer">Source video →</a>
    </section>

    <p id="empty" class="empty">Paste or drop a YouTube link to get started.</p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
