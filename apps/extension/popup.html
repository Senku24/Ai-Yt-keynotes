<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KeyNotes</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <main id="app">
    <header>
      <div class="brand">
        <div class="logo-badge" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M5.5 6.8C5.5 5.95 6.45 5.44 7.16 5.91L12.1 9.11C12.74 9.52 12.74 10.48 12.1 10.89L7.16 14.09C6.45 14.56 5.5 14.05 5.5 13.2V6.8Z" fill="white"/>
            <rect x="14.5" y="6.5" width="5" height="2.2" rx="1.1" fill="white"/>
            <rect x="14.5" y="10.9" width="3.8" height="2.2" rx="1.1" fill="white" fill-opacity="0.88"/>
            <rect x="14.5" y="15.3" width="4.6" height="2.2" rx="1.1" fill="white" fill-opacity="0.72"/>
          </svg>
        </div>
        <h1>Key<span>Notes</span></h1>
      </div>
      <p class="tagline">Distill any YouTube video into five crisp takeaways.</p>
    </header>

    <form id="url-form" novalidate>
      <label for="url-input" class="sr-only">YouTube URL</label>
      <div class="input-row" id="drop-zone">
        <input
          id="url-input"
          type="text"
          inputmode="url"
          placeholder="Paste YouTube watch, share, or Shorts link…"
          autocomplete="off"
          spellcheck="false"
        />
        <button type="submit" id="submit-btn">
          <span class="btn-text">Generate</span>
          <span class="btn-spinner" hidden>
            <svg class="spin" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
          </span>
        </button>
      </div>
    </form>

    <div id="toast" class="toast" hidden role="alert" aria-live="assertive">
      <span id="toast-msg"></span>
      <button id="toast-close" type="button" aria-label="Dismiss message">✕</button>
    </div>

    <div id="skeleton" class="skeleton-card" hidden role="status" aria-label="Generating keynotes">
      <div class="skel-status">Distilling transcript…</div>
      <div class="skel-line" style="width:86%"></div>
      <div class="skel-line" style="width:72%"></div>
      <div class="skel-line" style="width:92%"></div>
      <div class="skel-line" style="width:64%"></div>
      <div class="skel-line" style="width:78%"></div>
    </div>

    <section id="results" hidden aria-labelledby="notes-heading">
      <div class="results-bar"></div>
      <div class="results-header">
        <div class="results-title">
          <span class="dot"></span>
          <h2 id="notes-heading">Keynotes</h2>
        </div>
        <button id="copy-btn" type="button" class="copy-btn" title="Copy keynotes" aria-label="Copy keynotes">
          <svg id="copy-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
          </svg>
          <span id="copy-label">Copy</span>
        </button>
      </div>
      <ol id="notes-list"></ol>
      <div class="results-footer">
        <a id="source-link" class="source-link" target="_blank" rel="noopener noreferrer">Open on YouTube ↗</a>
      </div>
    </section>

    <div id="empty" class="empty">
      <p>Paste a link or drop one anywhere here.</p>
      <span class="empty-hint">Supports watch, youtu.be &amp; Shorts</span>
    </div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
